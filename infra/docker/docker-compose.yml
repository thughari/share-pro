version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  coturn:
    image: coturn/coturn:4.6
    command: ["-n", "--log-file=stdout", "--lt-cred-mech", "--realm=share-pro.local", "--user=turnuser:turnpassword"]
    ports:
      - '3478:3478'
      - '3478:3478/udp'

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - '3000:3000'
